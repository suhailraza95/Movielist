name: MovieList CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGO_URL: mongodb://localhost:27017/movielist_test
      PORT: 5003

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: |
          npm start &
          sleep 5

      - name: Health check
        run: curl --fail http://localhost:5003/health-wrong

      - name: Build Docker image
        run: docker build -t movielist-app .